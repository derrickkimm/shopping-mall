<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 수정</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>내 정보 수정</h1>
    <p>회원 이름과 비밀번호를 변경할 수 있습니다.</p>
  </header>

  <div class="user-link">
    <a href="index.html">
      <button>쇼핑몰로 돌아가기</button>
    </a>
  </div>

  <section class="auth-box">
    <h2>회원 정보</h2>

    <input type="text" id="profile-name" placeholder="이름">
    <input type="email" id="profile-email" placeholder="이메일" disabled>
    <input type="password" id="profile-password" placeholder="새 비밀번호">

    <button onclick="updateProfile()">정보 수정</button>

    <p id="profile-message"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
